<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEELKO - Sign Up</title>

<style>
body{
margin:0;
background:#0d1117;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#161b22;
padding:30px;
width:340px;
border-radius:15px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
color:#ff9800;
margin-bottom:10px;
}

p{
color:#bbb;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#ff9800;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

a{
color:#ff9800;
text-decoration:none;
}
</style>

</head>
<body>

<div class="box">

<h1>Create Account</h1>
<p>Join BEELKO Today</p>

<input type="text" placeholder="Full Name">

<input type="email" id="email" placeholder="Email">

<input type="tel" placeholder="Phone Number">

<input type="password" id="password" placeholder="Password">

<input type="password" placeholder="Confirm Password">
<button onclick="signUp()">Create Account</button>

<p style="margin-top:20px;">
Already have an account?<br>
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
