<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEELKO Login</title>

<style>
body{
margin:0;
background:#0d1117;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#161b22;
padding:30px;
width:320px;
border-radius:15px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
color:#ff9800;
margin-bottom:10px;
}

p{
color:#bbb;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#ff9800;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.social{
margin-top:20px;
}

.social button{
background:#24292f;
margin-top:8px;
}

a{
color:#ff9800;
text-decoration:none;
}
</style>

</head>
<body>

<div class="box">

<h1>BEELKO</h1>
<p>Welcome Back</p>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

<div class="social">
<button>📱 Continue with Phone</button>
<button>🔵 Continue with Google</button>
<button>🍎 Continue with Apple</button>
</div>

<p style="margin-top:20px;">
Don't have an account?<br>
<a href="#">Create Account</a>
</p>

</div>

</body>
  </html>
